<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="logo">Shop</a>
      <ul class="nav-links" id="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/cart.html">Cart</a></li>
        <li><a href="/orders.html">Orders</a></li>
        <li id="auth-link"><a href="/login.html">Login</a></li>
        <li id="user-greeting" class="hidden"><span></span> <a href="#" id="logout-btn">(Logout)</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <h1>Shopping Cart</h1>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-summary hidden" id="cart-summary">
      <p>Total: $<span id="total-price">0.00</span></p>
      <button id="checkout-btn" class="btn btn-success mt-20">Place Order</button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
